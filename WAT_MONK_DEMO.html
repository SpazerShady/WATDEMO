const I={back:'<path d="m15 18-6-6 6-6"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',home:'<path d="m3 11 9-8 9 8v9H5v-9"/><path d="M9 20v-6h6v6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',chev:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 12h5M5 6V4h13v2"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a2 2 0 0 0 .4 2.2l.1.1-2.8 2.8-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8V22H9.6v-.6a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2.8-2.8.1-.1A2 2 0 0 0 3.8 15 2 2 0 0 0 2 13.8V10h.6a2 2 0 0 0 1.2-1.2 2 2 0 0 0-.4-2.2l-.1-.1 2.8-2.8.1.1a2 2 0 0 0 2.2.4A2 2 0 0 0 9.6 2H13.5v.6a2 2 0 0 0 1.2 1.2 2 2 0 0 0 2.2-.4l.1-.1 2.8 2.8-.1.1a2 2 0 0 0-.4 2.2 2 2 0 0 0 1.8 1.2h.6v4h-.6a2 2 0 0 0-1.7 1.4Z"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="m4 16-1 5 5-1L19 9l-4-4Z"/><path d="m13 7 4 4"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/>',play:'<path d="m8 5 11 7-11 7Z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',refresh:'<path d="M20 7h-5V2M20 7a8 8 0 1 0 1 8"/>'};
function ic(n,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[n]||I.chev}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logo(){return `<div class="logo"><svg width="32" viewBox="0 0 48 48"><path fill="#e69a29" d="M24 3l4 13h-8z"/><path fill="#d4632c" d="M7 23l17-11 17 11z"/><path fill="#a56a29" d="M13 25h22v17H13z"/><path fill="#fff4df" d="M21 31h6v11h-6z"/></svg></div>`}
function topbar(title,back=true,right=''){return `<header class="top">${back?`<button class="icon-btn" onclick="goBack()">${ic('back')}</button>`:'<span class="spacer"></span>'}<h1>${esc(title)}</h1>${right||'<span class="spacer"></span>'}</header>`}
function userNav(active='home'){const items=[['home','Main','หน้าหลัก','home'],['search','GS01','ค้นหา','search'],['requests','S15','คำขอของฉัน','calendar'],['donation','D01','กองบุญ','heart'],['account','S22','บัญชี','user']];return `<nav class="bottom-nav">${items.map(([k,id,label,icon])=>`<button class="nav-btn ${active===k?'active':''}" onclick="go('${id}')">${ic(icon)}${k==='requests'?'<i class="badge">1</i>':''}<span>${label}</span></button>`).join('')}</nav>`}
function templeNav(active='overview'){const items=[['overview','TM01','ภาพรวม','home'],['requests','TM02','คำขอ','list'],['queue','TM04','ตารางคิว','calendar'],['activities','TM05','กิจกรรม','menu'],['settings','TM07','ตั้งค่า','settings']];return `<nav class="bottom-nav">${items.map(([k,id,label,icon])=>`<button class="nav-btn ${active===k?'active':''}" onclick="go('${id}')">${ic(icon)}${k==='requests'?'<i class="badge">2</i>':''}<span>${label}</span></button>`).join('')}</nav>`}
function managerNav(active='dashboard'){const items=[['dashboard','DM01','ภาพรวม','home'],['projects','DM01','โครงการ','list'],['create','DM02','สร้างใหม่','plus'],['reports','DM04','รายงาน','calendar'],['settings','DM11','ประวัติ','settings']];return `<nav class="bottom-nav">${items.map(([k,id,label,icon])=>`<button class="nav-btn ${active===k?'active':''}" onclick="go('${id}')">${ic(icon)}<span>${label}</span></button>`).join('')}</nav>`}
function stripAlias(id){const m=id.match(/^[LGX]\d+-([A-Z0-9].*)$/);return m?m[1]:id}
function go(id,push=true){if(!routeById.has(id)&&id!=='MAP')id='Main';if(push&&state.view!==id)state.history.push(state.view);state.view=id;state.sheet=null;render();document.getElementById('app').scrollTop=0;location.hash=encodeURIComponent(id)}
function goBack(){const id=state.history.pop();go(id||'Main',false)}
function setState(key,value,rerender=true){state[key]=value;if(rerender)render()}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}
function openRoles(){state.sheet='roles';renderLayer()}
function closeLayer(){state.sheet=null;renderLayer()}
function chooseRole(role){state.role=role;state.sheet=null;go({user:'Main',temple:'TM01',manager:'DM01',audit:'AD01'}[role]||'Main')}
function renderLayer(){const layer=document.getElementById('layer');if(!state.sheet){layer.innerHTML='';return}if(state.sheet==='roles'){const roles=[['user','ผู้ใช้งานทั่วไป','จองบริการ ร่วมบุญ และปฏิทิน','user'],['temple','เจ้าหน้าที่วัด','จัดการคำขอ คิว และกิจกรรม','home'],['manager','ผู้ดูแลกองบุญ','สร้างโครงการและรายงานยอด','heart'],['audit','ผู้ตรวจสอบ','ดูประวัติการเปลี่ยนแปลง','list']];layer.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeLayer()"><div class="sheet"><div class="handle"></div><h3>เลือกบทบาทสำหรับเดโม</h3>${roles.map(([id,name,sub,icon])=>`<button class="role-option ${state.role===id?'active':''}" onclick="chooseRole('${id}')"><span class="list-icon">${ic(icon)}</span><span class="list-text"><strong>${name}</strong><span>${sub}</span></span>${ic('chev')}</button>`).join('')}<button class="role-option" onclick="go('MAP');closeLayer()"><span class="list-icon">${ic('menu')}</span><span class="list-text"><strong>ผังหน้าจอทั้งหมด</strong><span>เข้าถึง 350 สถานะจาก Page Map</span></span>${ic('chev')}</button><button class="btn ghost btn-block" onclick="state.history=[];state.role='user';go('S01');closeLayer()" style="margin-top:10px">เริ่มเดโมใหม่</button></div></div>`;return}layer.innerHTML=state.sheet}
function render(){const id=stripAlias(state.view),app=document.getElementById('app'),nav=document.getElementById('nav');let html='';let navHtml='';if(state.view==='MAP'){html=viewMap();navHtml=''}else if(id==='S01')html=viewLogin();else if(id==='S01B')html=viewOTP();else if(id==='S01C')html=viewName();else if(id==='Main'){html=viewHome();navHtml=userNav('home')}else if(id==='S22'){html=viewAccount();navHtml=userNav('account')}else if(id.startsWith('B02'))html=viewCategories(id);else if(id==='S03')html=viewTemples();else if(id==='S04')html=viewServiceDetail();else if(id.startsWith('S05'))html=viewServiceForm(id);else if(id.startsWith('S06'))html=viewDate(id);else if(id.startsWith('S07'))html=viewReview(id);else if(id==='S08')html=viewLoading();else if(id.startsWith('S09')||id==='S11')html=viewRequest(id);else if(id.startsWith('S13'))html=viewPayment(id);else if(id==='S14')html=viewBookingSuccess();else if(id==='S15'){html=viewRequests();navHtml=userNav('requests')}else if(['S16','S17','S18','S19'].includes(id))html=viewManageBooking(id);else if(['S20','S21','S24','S25'].includes(id))html=viewSupport(id);else if(id.startsWith('F'))html=viewFuneral(id);else if(id.startsWith('D')&&!id.startsWith('DM')){html=viewDonation(id);navHtml=userNav('donation')}else if(id.startsWith('TM')){html=viewTempleAdmin(id);navHtml=templeNav(adminNavKey(id))}else if(id.startsWith('DM')){html=viewDonationManager(id);navHtml=managerNav()}else if(id==='AD01')html=viewAudit();else if(id.startsWith('BC'))html=viewCalendar(id);else if(id.startsWith('GS')){html=viewSearch(id);navHtml=userNav('search')}else html=viewGeneric(state.view);app.innerHTML=html;app.classList.toggle('no-nav',!navHtml);nav.innerHTML=navHtml;renderLayer()}
function adminNavKey(id){if(id==='TM01')return'overview';if(id==='TM02')return'requests';if(id==='TM04')return'queue';if(id.startsWith('TM05')||id.startsWith('TM06'))return'activities';return'settings'}
function viewLogin(){return `<div style="min-height:100%;background:linear-gradient(180deg,#fff7eb,#fff);padding:76px 24px 30px"><div style="text-align:center;margin-bottom:48px">${logo()}<div class="brand-name" style="margin-top:13px">WAT-Monk</div><p class="tagline">วัดใกล้ตัว เข้าถึงง่ายในทุกวัน</p></div><p class="eyebrow">เข้าสู่ระบบ</p><h1 class="lead">ใส่หมายเลขโทรศัพท์</h1><p class="sub">เราจะส่งรหัส OTP เพื่อยืนยันตัวตน</p><label class="field" style="margin-top:25px"><span>หมายเลขโทรศัพท์</span><input class="input" type="tel" inputmode="numeric" maxlength="10" placeholder="08X-XXX-XXXX" value="${esc(state.phone)}" oninput="state.phone=this.value.replace(/\D/g,'').slice(0,10);document.getElementById('loginNext').disabled=state.phone.length<9"></label><button id="loginNext" class="btn btn-block" ${state.phone.length<9?'disabled':''} onclick="go('S01B')">ขอรหัส OTP</button><p class="sub" style="text-align:center;margin-top:24px">การเข้าสู่ระบบถือว่าคุณยอมรับ<br><a style="color:var(--gold)" onclick="go('S21')">ข้อตกลงการใช้งานและนโยบายความเป็นส่วนตัว</a></p></div>`}
function viewOTP(){return `${topbar('ยืนยันรหัส OTP')}<div class="content"><p class="eyebrow">ยืนยันหมายเลขโทรศัพท์</p><h1 class="lead">กรอกรหัส 6 หลัก</h1><p class="sub">ส่งรหัสไปยัง ${state.phone||'081-234-5678'} · ใช้รหัสใดก็ได้สำหรับเดโม</p><label class="field" style="margin-top:28px"><span>รหัส OTP</span><input class="input" style="font-size:25px;letter-spacing:.5em;text-align:center" inputmode="numeric" maxlength="6" placeholder="••••••" value="${esc(state.otp)}" oninput="state.otp=this.value.replace(/\D/g,'').slice(0,6);document.getElementById('otpNext').disabled=state.otp.length<4"></label><button id="otpNext" class="btn btn-block" ${state.otp.length<4?'disabled':''} onclick="go('S01C')">ยืนยัน</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="toast('ส่งรหัสใหม่แล้ว')">ส่งรหัสอีกครั้ง</button></div>`}
function viewName(){return `${topbar('สร้างบัญชี')}<div class="content"><p class="eyebrow">ยินดีต้อนรับ</p><h1 class="lead">อยากให้เราเรียกคุณว่าอะไร</h1><p class="sub">ชื่อจะแสดงในคำขอที่ส่งให้วัด และแก้ไขได้ภายหลัง</p><label class="field" style="margin-top:25px"><span>ชื่อผู้ใช้งาน</span><input class="input" value="${esc(state.name)}" oninput="state.name=this.value"></label><button class="btn btn-block" onclick="go('Main')">เริ่มใช้งาน</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="state.name='ผู้ใช้งาน';go('Main')">ข้ามไปก่อน</button></div>`}
function viewHome(){return `<div class="hero-head"><div class="brand-row">${logo()}<div style="flex:1"><div class="brand-name">WAT-Monk</div><div class="tagline">วัดใกล้ตัว เข้าถึงง่ายในทุกวัน</div></div><button class="icon-btn" onclick="go('S20')">${ic('bell')}</button></div><div class="searchbar" onclick="go('GS01')">${ic('search')}<span>ค้นหากิจกรรม เช่น ขึ้นบ้านใหม่</span></div></div><button class="pending" onclick="go('S09')"><span class="clock">${ic('clock')}</span><span><small>คำขอล่าสุด · ทำบุญขึ้นบ้านใหม่</small><strong>รอชำระเงิน · <b>เหลือ 18:42 นาที</b></strong></span>${ic('chev')}</button><section class="section"><div class="section-title"><h2>จองบริการวัด</h2><span class="sub">เลือกหมวดเพื่อดูกิจกรรม</span></div><div class="grid2">${[['พิธีมงคล','ขึ้นบ้านใหม่ · วันเกิด · งานแต่ง','monks','B02-MG'],['พิธีอวมงคล','สวดพระอภิธรรม · 7/50/100 วัน','night','B02-AV'],['ถวายและทำบุญ','ภัตตาหาร · สังฆทาน · เลี้ยงพระ','offer','B02-OF'],['บริการสถานที่ในวัด','จองศาลา · พื้นที่จัดพิธี','hall','B02-VN']].map(([a,b,img,id])=>`<button class="cat-card" onclick="go('${id}')"><img src="${ASSET[img]}"><span class="cat-body"><strong>${a}</strong><span>${b}</span></span></button>`).join('')}</div></section><section class="section"><div class="section-title"><h2>บริการอื่นของ WAT-Monk</h2></div><div class="quick-grid"><button class="quick-card" onclick="go('GS04-TEMPLES')"><span class="quick-icon">${ic('pin')}</span>ค้นหาวัด</button><button class="quick-card" onclick="go('BC01-OCT')"><span class="quick-icon">${ic('calendar')}</span>ปฏิทินศาสนา</button><button class="quick-card" onclick="go('D01')"><span class="quick-icon">${ic('heart')}</span>กองบุญ</button></div></section>`}
function selectCategory(k,id){state.category=k;go(id)}
function viewCategories(id){if(id==='B02S'||id==='B02S3')return viewCategorySheet(id);const key=id.includes('AV')?'AV':id.includes('OF')?'OF':id.includes('VN')?'VN':'MG';state.category=key;const labels={MG:'พิธีมงคล',AV:'พิธีอวมงคล',OF:'ถวายและทำบุญ',VN:'สถานที่ในวัด'};return `${topbar('เลือกกิจกรรม')}<div class="tabs">${Object.entries(labels).map(([k,v])=>`<button class="pill ${key===k?'active':''}" onclick="selectCategory('${k}','B02-${k}')">${v}</button>`).join('')}</div><div class="content"><h1 class="lead">${labels[key]}</h1><p class="sub">เลือกกิจกรรมที่คุณต้องการ แล้วดูวัดที่ให้บริการ</p><div style="margin-top:17px">${services[key].map(([name,desc,img,target])=>`<button class="service-card" onclick="state.service='${name.replace(/'/g,"\\'")}';go('${target}')"><img src="${ASSET[img]}"><span><h3>${name}</h3><p>${desc}</p><span class="eyebrow" style="display:block;margin-top:8px">ดูวัดที่รองรับ →</span></span></button>`).join('')}</div></div>`}
function viewCategorySheet(id){const isSeven=id==='B02S';return `${topbar(isSeven?'ทำบุญ 7 / 50 / 100 วัน':'อุทิศส่วนกุศล')}<div class="content"><h1 class="lead">${isSeven?'เลือกวาระทำบุญ':'เลือกประเภทการอุทิศ'}</h1><p class="sub">ระบบจะช่วยคำนวณวันและแนะนำเวลาที่วัดว่าง</p>${(isSeven?['ครบ 7 วัน','ครบ 50 วัน','ครบ 100 วัน']:['ครบรอบ 1 ปี','ครบรอบประจำปี','อุทิศทั่วไป']).map((x,i)=>`<button class="role-option" onclick="state.service='${x}';go('S03')"><span class="list-icon">${ic(i===2?'calendar':'heart')}</span><span class="list-text"><strong>${x}</strong><span>${isSeven?'นับจากวันที่เสียชีวิต':'เลือกวันที่เหมาะสมได้'}</span></span>${ic('chev')}</button>`).join('')}</div>`}
function viewTemples(){return `${topbar('เลือกวัด')}<div class="steps">${[1,2,3,4,5].map((_,i)=>`<i class="${i<2?'done':''}"></i>`).join('')}</div><div class="content"><p class="eyebrow">${esc(state.service)}</p><h1 class="lead">เลือกวัดที่เหมาะกับคุณ</h1><p class="sub">เปรียบเทียบราคา จำนวนพระ และเงื่อนไขบริการ</p><div class="tabs" style="padding-left:0"><button class="pill active">ทั้งหมด (2)</button><button class="pill" onclick="toast('เรียงราคาต่ำไปสูง')">ราคาต่ำ–สูง</button><button class="pill" onclick="toast('กรองวัดจัดการเดินทาง')">วัดจัดการเดินทาง</button></div>${temples.map((t,i)=>`<article class="temple-card"><img src="${ASSET[t[4]]}"><div class="temple-info"><h3>${t[0]}</h3><p>${esc(state.service)} · 90 นาที</p><div class="facts"><div class="fact">ราคาเริ่มต้น<strong>${t[1]}</strong></div><div class="fact">จำนวนพระ<strong>${t[2]}</strong></div><div class="fact">การเดินทาง<strong>${t[3]}</strong></div></div><button class="btn outline btn-block" style="margin-top:12px" onclick="state.temple=${i};go('S04')">ดูรายละเอียด</button></div></article>`).join('')}</div>`}
function viewServiceDetail(){const t=temples[state.temple];return `${topbar('รายละเอียดบริการ')}<div class="hero-photo" style="background-image:url('${ASSET[t[4]]}')"><div class="hero-caption"><p class="eyebrow" style="color:#ffd9a7">${t[0]}</p><h2>${esc(state.service)}</h2></div></div><div class="content"><div class="row"><strong>ราคาเริ่มต้น</strong><strong style="font-size:22px;color:var(--gold)">${t[1]}</strong></div><p class="sub">พิธีครบถ้วนตามประเพณี พร้อมเจ้าหน้าที่ประสานงานจากวัด ดูแลตั้งแต่เตรียมงานจนเสร็จพิธี</p><div class="summary"><div class="row"><span>ระยะเวลา</span><strong>ประมาณ 90 นาที</strong></div><div class="row"><span>จำนวนพระ</span><strong>${t[2]}</strong></div><div class="row"><span>การเดินทาง</span><strong>${t[3]}</strong></div><div class="row"><span>นิมนต์พระและอุปกรณ์พิธี</span><strong>รวมแล้ว</strong></div></div><h3>สิ่งที่ผู้จองต้องเตรียม</h3>${['สถานที่สะอาดและโต๊ะหมู่บูชา','รายชื่อเจ้าภาพและผู้ร่วมพิธี','อาหารหรือเครื่องไทยธรรม (ถ้ามี)'].map(x=>`<div class="checkline">${ic('check')}<span>${x}</span></div>`).join('')}<div class="notice">ราคาที่แสดงเป็นราคาเริ่มต้น ยอดจริงขึ้นอยู่กับจำนวนพระและรายการเสริม</div></div><div class="sticky-cta"><button class="btn btn-block" onclick="go(serviceFormId())">ดำเนินการต่อ</button></div>`}
function serviceFormId(){const s=state.service;if(s.includes('วันเกิด'))return'S05-A2';if(s.includes('งานแต่ง'))return'S05-A3';if(s.includes('เปิดกิจการ'))return'S05-A4';if(s.includes('งานบวช'))return'S05-A5';if(s.includes('เจริญ'))return'S05-A6';if(s.includes('7')||s.includes('50')||s.includes('100'))return'S05-B2';if(s.includes('อุทิศ'))return'S05-B3';if(s.includes('ภัตตาหาร'))return'S05-C1';if(s.includes('สังฆทาน'))return'S05-C2';if(s.includes('เลี้ยงพระ'))return'S05-C3';if(s.includes('ทั่วไป'))return'S05-C4';if(s.includes('ศาลา'))return'S05-D1';if(s.includes('พื้นที่'))return'S05-D2';return'S05-A1'}
function viewServiceForm(id){const special=id.includes('A3')?'ข้อมูลคู่บ่าวสาว':id.includes('B2')||id.includes('B3')?'ข้อมูลผู้ล่วงลับ':'ข้อมูลงาน';return `${topbar(special)}<div class="steps">${[1,2,3,4,5].map((_,i)=>`<i class="${i<3?'done':''}"></i>`).join('')}</div><div class="content"><p class="eyebrow">${esc(state.service)}</p><h1 class="lead">กรอกข้อมูลสำหรับวัด</h1><p class="sub">ข้อมูลนี้ช่วยให้วัดเตรียมพระและอุปกรณ์ได้เหมาะสม</p><label class="field"><span>${id.includes('B')?'ชื่อผู้ล่วงลับ':'ชื่อเจ้าภาพ'}</span><input class="input" value="${esc(state.name)}" oninput="state.name=this.value"></label>${id.includes('A3')?'<label class="field"><span>ชื่อคู่สมรส</span><input class="input" value="คุณธนา"></label>':''}<label class="field"><span>จำนวนผู้เข้าร่วมโดยประมาณ</span><select class="input"><option>10–20 คน</option><option selected>21–50 คน</option><option>มากกว่า 50 คน</option></select></label><span class="field"><span>จำนวนพระ</span><span class="choice-grid">${[5,9].map(n=>`<button class="choice ${state.monks===n?'selected':''}" onclick="setState('monks',${n})"><strong>${n} รูป</strong><span>เหมาะกับงาน${n===5?'ขนาดเล็ก':'ขนาดใหญ่'}</span></button>`).join('')}</span></span><label class="field"><span>สถานที่จัดงาน</span><input class="input" value="${esc(state.address)}" oninput="state.address=this.value"></label><label class="field"><span>รายละเอียดเพิ่มเติม (ไม่บังคับ)</span><textarea class="input" placeholder="เช่น ข้อจำกัดการเดินทาง">${esc(state.note)}</textarea></label><button class="btn btn-block" onclick="go(dateTarget('${id}'))">ถัดไป · เลือกวัน</button></div>`}
function dateTarget(id){if(id.includes('A3'))return'S06-M2W';if(id.includes('B2'))return'S06-M3';if(id.includes('C1')||id.includes('C2'))return'S06-M4';if(id.includes('D'))return'S06-M5';return'S06'}
function calendarHtml(){const days=['อา','จ','อ','พ','พฤ','ศ','ส'];return `<div class="calendar"><div class="cal-head"><button class="icon-btn" onclick="toast('เดือนก่อนหน้า')">${ic('back')}</button><strong>พฤศจิกายน 2569</strong><button class="icon-btn" onclick="toast('เดือนถัดไป')">${ic('chev')}</button></div><div class="cal-grid">${days.map(x=>`<b>${x}</b>`).join('')}${Array.from({length:35},(_,i)=>{const d=i-1;return d>0&&d<31?`<button class="day ${d===20?'active':d%7===0?'mark':''}" onclick="state.date='${d} พ.ย. 2569';render()">${d}</button>`:'<span></span>'}).join('')}</div></div>`}
function viewDate(id){if(id==='S06-M2'||id==='S06-M2W')return viewAuspicious(id);if(id==='S06-M2R')return viewAuspiciousResults();const isRounds=id==='S06-M4',isPlace=id==='S06-M5',isCount=id==='S06-M3';return `${topbar('เลือกวันและเวลา')}<div class="steps">${[1,2,3,4,5].map((_,i)=>`<i class="${i<4?'done':''}"></i>`).join('')}</div><div class="content"><p class="eyebrow">${isCount?'ระบบคำนวณวันครบให้แล้ว':esc(state.service)}</p><h1 class="lead">${isCount?'วันที่แนะนำ: ศุกร์ 20 พ.ย.':'เลือกวันที่สะดวก'}</h1>${calendarHtml()}<h3 style="margin:18px 0 10px">${isRounds?'เลือกรอบถวาย':isPlace?'เวลาเริ่ม–สิ้นสุด':'เวลาที่วัดว่าง'}</h3><div class="slots">${(isRounds?['07:00 รอบเช้า','11:00 รอบเพล']:['09:00','10:30','13:00','15:00']).map(t=>`<button class="slot ${state.time===t?'active':''}" onclick="setState('time','${t}')">${t}</button>`).join('')}</div><div class="notice green">วัดแสงธรรมจำลองว่างในช่วงเวลาที่เลือก ระบบจะตรวจสอบอีกครั้งก่อนส่งคำขอ</div><button class="btn btn-block" onclick="go('S07')">ถัดไป · ตรวจสอบ</button></div>`}
function viewAuspicious(id){return `${topbar('หาฤกษ์')}<div class="content"><p class="eyebrow">ตัวช่วยเลือกวัน</p><h1 class="lead">${id==='S06-M2W'?'วันเกิดของทั้งสองคน':'วันเกิดเจ้าภาพ'}</h1><p class="sub">ใช้ข้อมูลวันเกิดเพื่อแนะนำวันและเวลาที่เหมาะสมตามปฏิทินไทย</p><label class="field"><span>วัน / เดือน / ปีเกิด</span><input class="input" type="date" value="1994-05-19"></label>${id==='S06-M2W'?'<label class="field"><span>วันเกิดคู่สมรส</span><input class="input" type="date" value="1995-08-12"></label>':''}<div class="notice">คำแนะนำเป็นข้อมูลประกอบการตัดสินใจ กรุณาตรวจสอบกับครอบครัวและวัดอีกครั้ง</div><button class="btn btn-block" onclick="go('S06-M2R')">หาวันฤกษ์</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="go('S06')">กำหนดวันเอง</button></div>`}
function viewAuspiciousResults(){return `${topbar('ฤกษ์ที่แนะนำ')}<div class="content"><p class="eyebrow">พบ 3 วันที่วัดว่าง</p><h1 class="lead">เลือกวันที่เหมาะกับคุณ</h1>${[['อา. 22 พ.ย. 2569','09:09–10:39 น.','วันธงชัยของผู้เกิดวันพฤหัสบดี'],['พ. 25 พ.ย. 2569','08:39–10:09 น.','ช่วงเวลามงคล เหมาะกับการเริ่มต้น'],['ส. 5 ธ.ค. 2569','09:19–10:49 น.','วันครอบครัวสะดวกและวัดว่าง']].map((x,i)=>`<button class="role-option" onclick="state.date='${x[0]}';state.time='${x[1]}';go('S07')"><span class="list-icon">${ic('calendar')}</span><span class="list-text"><strong>${x[0]} · ${x[1]}</strong><span>${x[2]}</span></span>${ic('chev')}</button>`).join('')}<button class="btn ghost btn-block" onclick="go('S06')">เลือกวันด้วยตัวเอง</button></div>`}
function viewReview(id){if(id==='S07T'||id==='S07D')return viewConflict(id);const t=temples[state.temple];return `${topbar('ตรวจสอบก่อนส่ง')}<div class="steps">${[1,2,3,4,5].map((_,i)=>`<i class="done"></i>`).join('')}</div><div class="content"><p class="eyebrow">ขั้นตอนสุดท้าย</p><h1 class="lead">ตรวจสอบคำขอ</h1><div class="summary"><div class="row"><span>กิจกรรม</span><strong>${esc(state.service)}</strong></div><div class="row"><span>วัด</span><strong>${t[0]}</strong></div><div class="row"><span>วันเวลา</span><strong>${esc(state.date)} · ${esc(state.time)}</strong></div><div class="row"><span>จำนวนพระ</span><strong>${state.monks} รูป</strong></div><div class="row"><span>สถานที่</span><strong>${esc(state.address)}</strong></div><div class="row total"><span>ยอดประมาณการ</span><strong>฿2,500</strong></div></div><label class="checkline"><input type="checkbox" checked><span>ยืนยันว่าข้อมูลถูกต้อง และยอมรับเงื่อนไขการจอง</span></label><button class="btn btn-block" onclick="go('S08');setTimeout(()=>{if(state.view==='S08')go('S09')},1500)">ส่งคำขอ</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="go(serviceFormId())">แก้ไขข้อมูล</button></div>`}
function viewConflict(id){const dup=id==='S07D';return `${topbar('ตรวจสอบก่อนส่ง')}<div class="content"><div class="notice red"><strong>${dup?'พบคำขอที่คล้ายกัน':'เวลานี้เพิ่งถูกจอง'}</strong><br>${dup?'คุณมีคำขอสำหรับงานนี้อยู่แล้ว':'กรุณาเลือกหนึ่งในเวลาที่วัดยังว่าง'}</div>${dup?`<button class="btn btn-block" onclick="go('S09')">ดูคำขอเดิม</button>`:`<div class="slots">${['11:00 20 พ.ย.','13:00 20 พ.ย.','10:30 21 พ.ย.'].map(x=>`<button class="slot" onclick="state.time='${x}';go('S07')">${x}</button>`).join('')}</div>`}<button class="btn ghost btn-block" style="margin-top:10px" onclick="go('S06')">เลือกวันเวลาอื่น</button></div>`}
function viewLoading(){return `${topbar('กำลังส่งคำขอ',false)}<div class="loader"></div><div style="text-align:center;padding:0 24px"><h2>กำลังตรวจสอบคิววัด</h2><p class="sub">ตรวจเกณฑ์ จำนวนพระ และช่วงเวลาที่เลือก<br>ใช้เวลาประมาณ 3–5 วินาที</p></div>`}
function viewRequest(id){if(id==='S11')return `${topbar('ไม่สามารถรับคำขอ')}<div class="empty">${ic('calendar')}<h2>เวลานี้ไม่ผ่านเกณฑ์ของวัด</h2><p>จำนวนพระไม่พอในช่วงเวลาที่เลือก ลองดูเวลาที่ระบบแนะนำ</p><button class="btn" onclick="go('S06-M2R')">เลือกเวลาใหม่</button></div>`;const locked=id==='S09L',cancelled=id==='S09TC';return `${topbar('รายละเอียดคำขอ')}<div class="content"><div class="notice ${cancelled?'red':'green'}"><strong>${cancelled?'วัดยกเลิกงาน · คืนเงินเต็มยอด':locked?'ใกล้วันงานแล้ว':'กันคิวให้คุณแล้ว'}</strong><br>${cancelled?'เงินคืนจะเข้าภายใน 3–5 วันทำการ':locked?'เหลือน้อยกว่า 48 ชั่วโมง จึงไม่สามารถแก้ไขได้':'ชำระเงินภายใน 30 นาทีเพื่อยืนยันการจอง'}</div><div class="summary"><div class="row"><span>เลขคำขอ</span><strong>WM-000003</strong></div><div class="row"><span>กิจกรรม</span><strong>${esc(state.service)}</strong></div><div class="row"><span>วัด</span><strong>${temples[state.temple][0]}</strong></div><div class="row"><span>วันเวลา</span><strong>${esc(state.date)} · ${esc(state.time)}</strong></div><div class="row total"><span>ยอดที่ต้องชำระ</span><strong>฿2,500</strong></div></div>${!locked&&!cancelled?'<button class="btn btn-block" onclick="go(\'S13\')">ชำระเงิน</button><button class="btn outline btn-block" style="margin-top:9px" onclick="go(\'S16\')">แก้ไขคำขอ</button>':''}${cancelled?'<button class="btn btn-block" onclick="go(\'S03\')">เลือกวัดใหม่</button>':'<button class="btn ghost btn-block" style="margin-top:9px" onclick="go(\'S19\')">ยกเลิกคำขอ</button>'}</div>`}
function qrHtml(){return `<div class="qr">${Array.from({length:81},(_,i)=>`<i class="${((i*7+i%4*3)%11<5||[0,1,2,9,10,11,18,19,20,60,61,62,69,70,71,78,79,80].includes(i))?'on':''}"></i>`).join('')}</div>`}
function viewPayment(id){if(id==='S13X')return `${topbar('หมดเวลาชำระ')}<div class="empty">${ic('clock')}<h2>คิวถูกปล่อยแล้ว</h2><p>หมดเวลาชำระ 30 นาที คุณสามารถตรวจสอบคิวและส่งคำขอใหม่ได้</p><button class="btn" onclick="go('S06')">เลือกวันเวลาใหม่</button></div>`;if(id==='S13R1'||id==='S13R2')return `${topbar('ตรวจสอบยอดชำระ')}<div class="content"><div class="notice ${id==='S13R2'?'red':'green'}"><strong>${id==='S13R2'?'คิวถูกจองไปแล้ว':'คิวยังว่าง'}</strong><br>${id==='S13R2'?'ระบบจะคืนเงินเต็มยอดอัตโนมัติ':'ระบบยืนยันการจองต่อให้แล้ว'}</div><button class="btn btn-block" onclick="go('${id==='S13R2'?'S15':'S14'}')">รับทราบ</button></div>`;return `${topbar('ชำระเงิน')}<div class="content" style="text-align:center"><p class="eyebrow">QR พร้อมเพย์จำลอง</p><h1 class="lead">ยอดชำระ ฿2,500</h1>${qrHtml()}<div class="timer">เหลือเวลา 18:42 นาที</div><p class="sub">สแกนด้วยแอปธนาคาร จากนั้นกดยืนยันการชำระสำหรับเดโม</p><button class="btn btn-block" onclick="state.requestStatus='confirmed';go('S14')">ฉันชำระเงินแล้ว</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="toast('บันทึกภาพ QR แล้ว')">บันทึก QR</button></div>`}

function donationProjectFor(id){const m=id.match(/K0?(\d+)/);if(m)return Math.max(0,Math.min(projects.length-1,Number(m[1])-1));return state.project}

function viewDonation(id){state.project=donationProjectFor(id);const p=projects[state.project];if(id==='D01'||id==='D01-S'||id==='D01-X')return viewDonationHome(id);if(id.startsWith('D02'))return viewDonationDetail(id,p);if(id.startsWith('D03-S'))return viewDonationPaid(id,p);if(id.startsWith('D03'))return viewDonationPay(id,p);if(id.startsWith('D04'))return viewDonationPrayer(id,p);if(id.startsWith('D05'))return viewDonationAnimation(id,p);if(id.startsWith('D06'))return viewDonationSummary(id,p);if(id==='D07')return viewDonationHistory();if(id==='D08')return viewDonationPersonal();if(id.startsWith('D09'))return viewDonationProgress(id,p);if(id==='D11')return viewRefund();return viewGeneric(state.view)}

function viewReligiousCalendar(id){const m=id.match(/BC01-([A-Z]{3})/),codes=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];if(m)state.calendarMonth=codes.indexOf(m[1]);const month=months[state.calendarMonth]||'ตุลาคม';const notify=id.startsWith('BC12');return `${topbar(notify?'การแจ้งเตือนวันสำคัญ':'ปฏิทินศาสนา',!notify)}<div class="content">${notify?`<div class="notice green"><strong>เปิดแจ้งเตือนแล้ว</strong><br>ระบบจะแจ้งก่อนวันสำคัญ 1 วัน</div>${holyDays.slice(0,6).map((x,i)=>`<label class="checkline"><input type="checkbox" ${i<4?'checked':''}><span>${x}</span></label>`).join('')}<button class="btn btn-block" onclick="toast('บันทึกการแจ้งเตือนแล้ว')">บันทึก</button>`:`<div class="cal-head"><button class="icon-btn" onclick="state.calendarMonth=(state.calendarMonth+11)%12;render()">${ic('back')}</button><strong>${month} 2569</strong><button class="icon-btn" onclick="state.calendarMonth=(state.calendarMonth+1)%12;render()">${ic('chev')}</button></div>${calendarHtml()}<h3 style="margin-top:20px">วันสำคัญเดือนนี้</h3>${[['19 ต.ค.','วันพระ','ขึ้น 8 ค่ำ เดือน 11','BC03-UPO'],['27 ต.ค.','วันออกพรรษา','ขึ้น 15 ค่ำ เดือน 11','BC03-LENTEND'],['28 ต.ค.','วันตักบาตรเทโว','แรม 1 ค่ำ เดือน 11','BC03-TAKBAT']].map(x=>`<button class="list-item" onclick="go('${x[3]}')"><span class="list-icon">${ic('calendar')}</span><span class="list-text"><strong>${x[0]} · ${x[1]}</strong><span>${x[2]}</span></span>${ic('chev')}</button>`).join('')}<button class="btn outline btn-block" style="margin-top:16px" onclick="go('BC12')">ตั้งค่าการแจ้งเตือน</button>`}</div>`}
function holyName(id){const map={UPO:'วันพระ',MAKHA:'วันมาฆบูชา',VISAKHA:'วันวิสาขบูชา',ATTHAMI:'วันอัฏฐมีบูชา',ASALHA:'วันอาสาฬหบูชา',LENTSTART:'วันเข้าพรรษา',LENTEND:'วันออกพรรษา',TAKBAT:'วันตักบาตรเทโว',KATHIN:'ช่วงทอดกฐิน',PHAPA:'งานทอดผ้าป่า'};const k=Object.keys(map).find(k=>id.includes(k));return map[k]||'วันสำคัญทางพุทธศาสนา'}
function viewHolyDay(id){const name=holyName(id),popup=/-P\d/.test(id);if(popup)return `${topbar(name)}<div class="content"><div class="notice"><strong>เตรียมตัวสำหรับกิจกรรม</strong><br>${id.endsWith('P1')?'เลือกเวลาที่สะดวกและหาสถานที่สงบ':id.endsWith('P2')?'กิจกรรมใช้เวลาประมาณ 10–15 นาที':'พร้อมแล้ว เริ่มกิจกรรมได้เลย'}</div><button class="btn btn-block" onclick="go('BC06-CH')">เริ่มกิจกรรม</button></div>`;return `${topbar(name)}<div class="hero-photo" style="background-image:url('${ASSET.night}')"><div class="hero-caption"><p class="eyebrow" style="color:#ffd9a7">ปฏิทินศาสนา</p><h2>${name}</h2></div></div><div class="content"><p class="sub">เรียนรู้ความหมายและร่วมกิจกรรมที่เหมาะกับวันสำคัญ สร้างช่วงเวลาแห่งสติได้ทุกที่</p><div class="summary"><div class="row"><span>วันที่</span><strong>19 ตุลาคม 2569</strong></div><div class="row"><span>จันทรคติ</span><strong>ขึ้น 8 ค่ำ เดือน 11</strong></div></div><button class="role-option" onclick="go('BC06-CH')"><span class="list-icon">${ic('play')}</span><span class="list-text"><strong>สวดมนต์และนั่งสมาธิ</strong><span>กิจกรรมเสมือน · 10–15 นาที</span></span>${ic('chev')}</button><button class="role-option" onclick="go('BC13')"><span class="list-icon">${ic('heart')}</span><span class="list-text"><strong>ทำบุญกับวัด</strong><span>เลือกวัดและรับ QR จำลอง</span></span>${ic('chev')}</button></div>`}
function viewVirtualStart(id){if(id.includes('ERR'))return `${topbar('ข้อมูลไม่ถูกต้อง')}<div class="empty">${ic('refresh')}<h2>กรุณาตรวจสอบข้อมูล</h2><p>ระยะเวลานั่งสมาธิต้องอยู่ระหว่าง 1–60 นาที</p><button class="btn" onclick="go('BC06-CH')">กลับไปแก้ไข</button></div>`;if(id.includes('RESUME'))return `${topbar('มีกิจกรรมค้าง')}<div class="content"><div class="notice">คุณทำกิจกรรมถึงช่วงสวดมนต์บทที่ 2 แล้ว</div><button class="btn btn-block" onclick="go('BC07-CH-2')">ทำต่อจากเดิม</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="go('BC06-CH')">เริ่มใหม่</button></div>`;return `${topbar('สวดมนต์และนั่งสมาธิ')}<div class="chant"><div class="lotus">🪷</div><h1>ช่วงเวลาแห่งสติ</h1><p class="sub">เลือกบทสวดและระยะเวลาที่เหมาะกับคุณ</p><label class="field" style="text-align:left"><span>บทสวด</span><select class="input"><option>บูชาพระรัตนตรัย</option><option>แผ่เมตตา</option><option>ชินบัญชร</option></select></label><label class="field" style="text-align:left"><span>นั่งสมาธิ</span><select class="input"><option>5 นาที</option><option selected>10 นาที</option><option>15 นาที</option></select></label><button class="btn btn-block" onclick="state.chantStep=1;go('BC07-CH-1')">เริ่มกิจกรรม</button></div>`}
function viewVirtualActivity(id){const isPause=id.includes('-P'),isExit=id.includes('EXIT'),meditate=id.includes('-3')||id.includes('-4');if(isExit)return `${topbar('ยืนยันการออก')}<div class="content"><div class="notice">ความคืบหน้าจะถูกบันทึก คุณกลับมาทำต่อได้ภายหลัง</div><button class="btn danger btn-block" onclick="go('BC03-UPO')">ออกจากกิจกรรม</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="go('BC07-CH-2')">ทำต่อ</button></div>`;return `<div class="chant" style="min-height:100%;padding-top:70px;background:linear-gradient(#fffaf0,#f4e2c7)"><button class="icon-btn" style="position:absolute;top:45px;left:18px" onclick="go('BC07-CH-EXIT')">${ic('close')}</button><p class="eyebrow">${meditate?'นั่งสมาธิ':'บทสวดที่ '+(id.match(/-(\d)/)?.[1]||1)}</p><div class="lotus">🪷</div><div class="chant-card"><h2>${meditate?'กำหนดลมหายใจเข้า–ออกอย่างเป็นธรรมชาติ':'อิติปิโส ภควา อรหัง สัมมาสัมพุทโธ...'}</h2><p class="sub">${meditate?'วางใจไว้กับลมหายใจ':'เลื่อนตามบทสวดหรือแตะเพื่อไปต่อ'}</p></div><div class="big-timer">${meditate?'09:42':'02:18'}</div><div style="display:flex;justify-content:center;gap:12px;margin-top:20px"><button class="icon-btn" style="background:#fff" onclick="toast('ย้อน 10 วินาที')">↶</button><button class="btn" onclick="${isPause?"go('BC07-CH-2')":meditate?"go('BC08-CH')":"go('BC07-CH-3')"}">${isPause?'ทำต่อ':meditate?'เสร็จสิ้น':'ถัดไป'}</button><button class="icon-btn" style="background:#fff" onclick="go('BC07-CH-P')">Ⅱ</button></div></div>`}
function viewVirtualSuccess(id){return `${topbar('กิจกรรมสำเร็จ',false)}<div class="success"><div class="success-icon">${ic('check')}</div><h2>อนุโมทนากับช่วงเวลาแห่งสติ</h2><p>คุณสวดมนต์และนั่งสมาธิครบ 12 นาที<br>ทำต่อเนื่องแล้ว 3 วัน</p><button class="btn btn-block" onclick="go(idForShare('${id}'))">สร้างภาพแชร์</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="go('BC03-UPO')">กลับไปวันสำคัญ</button></div>`}
function idForShare(id){const suffix=id.replace('BC08','');const target='BC09'+suffix;return routeById.has(target)?target:'BC09-CH'}
function viewVirtualShare(id){if(id==='BC09-ERR')return `${topbar('บันทึกภาพไม่สำเร็จ')}<div class="empty">${ic('refresh')}<h2>ลองอีกครั้ง</h2><button class="btn" onclick="go('BC09-CH')">สร้างภาพใหม่</button></div>`;return `${topbar('ภาพแชร์')}<div class="content"><div class="card" style="padding:28px;text-align:center;background:linear-gradient(145deg,#fff6df,#eed1a4)"><div style="font-size:60px">🪷</div><p class="eyebrow">WAT-Monk</p><h2>วันนี้ฉันให้เวลากับใจ<br>12 นาที</h2><p class="sub">สวดมนต์และนั่งสมาธิ · ${holyName(state.view)}</p></div><button class="btn btn-block" onclick="toast('บันทึกภาพแล้ว')">บันทึกภาพ</button><button class="btn outline btn-block" style="margin-top:9px" onclick="toast('เปิดเมนูแชร์แล้ว')">${ic('share')} แชร์</button></div>`}
function viewTempleDonate(id){if(id==='BC13-EMPTY')return `${topbar('เลือกวัด')}<div class="empty">${ic('pin')}<h2>ยังไม่มีข้อมูลวัดในพื้นที่นี้</h2><p>ลองค้นหาในเขตใกล้เคียง</p><button class="btn" onclick="go('BC13')">ค้นหาใหม่</button></div>`;return `${topbar('เลือกวัด')}<div class="content"><p class="sub">เลือกวัดที่ต้องการร่วมทำบุญเนื่องในวันสำคัญ</p>${temples.concat([['วัดอรุณราชวราราม','กรุงเทพฯ','','','hero']]).map((t,i)=>`<button class="list-item" onclick="go('BC14-T${i+1}')"><img src="${ASSET[t[4]]}" style="width:54px;height:54px;border-radius:13px;object-fit:cover"><span class="list-text"><strong>${t[0]}</strong><span>พร้อมเพย์ของวัด · ข้อมูลจำลอง</span></span>${ic('chev')}</button>`).join('')}</div>`}
function viewTempleQR(id){const i=Math.max(0,Number(id.match(/T(\d)/)?.[1]||1)-1),name=[temples[0][0],temples[1][0],'วัดอรุณราชวราราม'][i];return `${topbar('QR ร่วมทำบุญ')}<div class="content" style="text-align:center"><p class="eyebrow">${name}</p><h1 class="lead">สแกนด้วยแอปธนาคาร</h1>${qrHtml()}<p class="sub">QR จำลองสำหรับการนำเสนอ ไม่มีการชำระเงินจริง</p><button class="btn btn-block" onclick="toast('บันทึก QR แล้ว')">บันทึก QR</button></div>`}
function viewSearch(id){if(id.startsWith('GS06'))return viewTempleProfile(id);if(id==='GS03'||id==='GS03-ZERO')return viewSearchFilters(id);if(id==='GS04'||id==='GS04-TEMPLES')return viewSearchCategory(id);if(id==='GS05')return `${topbar('ผลการค้นหา')}<div class="empty">${ic('search')}<h2>ไม่พบรายการ</h2><p>ลองใช้คำค้นอื่นหรือปรับตัวกรอง</p><button class="btn" onclick="go('GS01')">ค้นหาใหม่</button></div>`;if(id.startsWith('GS02'))return viewSearchResults(id);const typing=id==='GS01-TYPE'||id==='GS01-EDIT';return `${topbar('ค้นหา',id!=='GS01-TAB')}<div class="content"><label class="searchbar" style="margin:0;border:1px solid var(--line)">${ic('search')}<input id="globalSearch" autofocus placeholder="ค้นหาวัด กิจกรรม และอื่น ๆ" value="${typing?esc(state.search||'ขึ้นบ้านใหม่'):''}" oninput="state.search=this.value;document.getElementById('suggestions').innerHTML=searchSuggestions(this.value)"></label><div id="suggestions">${searchSuggestions(typing?state.search||'ขึ้นบ้านใหม่':'')}</div></div>`}
function searchSuggestions(q){if(!q)return `<p class="eyebrow" style="margin-top:22px">ค้นหายอดนิยม</p>${['ทำบุญขึ้นบ้านใหม่','วัดใกล้ฉัน','วันพระ','ร่วมซ่อมหลังคา'].map(x=>`<button class="list-item" onclick="state.search='${x}';go('GS02')"><span class="list-icon">${ic('search')}</span><span class="list-text"><strong>${x}</strong></span>${ic('chev')}</button>`).join('')}`;return `<p class="eyebrow" style="margin-top:22px">คำแนะนำ</p>${['ทำบุญขึ้นบ้านใหม่','วัดที่รับขึ้นบ้านใหม่','ฤกษ์ขึ้นบ้านใหม่'].map(x=>`<button class="list-item" onclick="state.search='${x}';go('GS02')"><span class="list-icon">${ic('search')}</span><span class="list-text"><strong>${x}</strong><span>แตะเพื่อค้นหา</span></span></button>`).join('')}`}
function viewSearchResults(id){if(id==='GS02-LOAD')return `${topbar('ผลการค้นหา')}<div class="loader"></div><p class="sub" style="text-align:center">กำลังค้นหาทั่วทั้งแอป</p>`;if(id==='GS02-ERR')return `${topbar('ผลการค้นหา')}<div class="empty">${ic('refresh')}<h2>โหลดผลการค้นหาไม่สำเร็จ</h2><button class="btn" onclick="go('GS02')">ลองอีกครั้ง</button></div>`;return `${topbar('ผลการค้นหา')}<div class="content search-results"><div class="searchbar" style="margin:0;border:1px solid var(--line)" onclick="go('GS01-EDIT')">${ic('search')}<span>${esc(state.search||'ขึ้นบ้านใหม่')}</span></div><div class="tabs" style="padding-left:0"><button class="pill active">ทั้งหมด</button><button class="pill" onclick="go('GS04')">กิจกรรม</button><button class="pill" onclick="go('GS04-TEMPLES')">วัด</button><button class="pill" onclick="go('GS03')">ตัวกรอง</button></div><div class="section-title"><h3>กิจกรรม</h3><a onclick="go('GS04')">ดูทั้งหมด</a></div><button class="service-card" onclick="state.service='ทำบุญขึ้นบ้านใหม่';go('S03')"><img src="${ASSET.monks}"><span><h3>ทำบุญขึ้นบ้านใหม่</h3><p>2 วัดรองรับ · เริ่ม ฿1,800</p></span></button><div class="section-title"><h3>วัด</h3><a onclick="go('GS04-TEMPLES')">ดูทั้งหมด</a></div>${templeNames.slice(0,3).map((n,i)=>`<button class="list-item" onclick="go('GS06-T0${i+1}')"><img src="${ASSET[i%2?'temple2':'temple1']}" style="width:54px;height:54px;border-radius:13px;object-fit:cover"><span class="list-text"><strong>${n}</strong><span>กรุงเทพฯ · มีกิจกรรมที่ตรงกัน</span></span>${ic('chev')}</button>`).join('')}<div class="section-title" style="margin-top:20px"><h3>กองบุญ</h3></div><button class="list-item" onclick="go('D02')"><span class="list-icon">${ic('heart')}</span><span class="list-text"><strong>ร่วมซ่อมหลังคาอุโบสถ</strong><span>ระดมทุนแล้ว 68%</span></span>${ic('chev')}</button></div>`}
function viewSearchFilters(id){const zero=id==='GS03-ZERO';return `${topbar('ตัวกรอง')}<div class="content"><h3>ประเภทผลลัพธ์</h3>${['กิจกรรมและบริการ','วัด','กองบุญ','วันสำคัญ'].map((x,i)=>`<label class="checkline"><input type="checkbox" ${zero?'':i<3?'checked':''}><span>${x}</span></label>`).join('')}<h3>ระยะทางจากฉัน</h3><input type="range" min="1" max="30" value="10" style="width:100%;accent-color:var(--gold)"><p class="sub">ไม่เกิน 10 กิโลเมตร</p><button class="btn btn-block" onclick="go('${zero?'GS05':'GS02'}')">แสดงผลลัพธ์</button><button class="btn ghost btn-block" style="margin-top:9px" onclick="go('GS03-ZERO')">ล้างตัวกรอง</button></div>`}
function viewSearchCategory(id){const templesOnly=id==='GS04-TEMPLES';return `${topbar(templesOnly?'วัดทั้งหมด':'กิจกรรมทั้งหมด')}<div class="content">${templesOnly?templeNames.map((n,i)=>`<button class="list-item" onclick="go('GS06-T${String(i+1).padStart(2,'0')}')"><img src="${ASSET[i%3===0?'temple1':i%3===1?'temple2':'hero']}" style="width:54px;height:54px;border-radius:13px;object-fit:cover"><span class="list-text"><strong>${n}</strong><span>กรุงเทพฯ · ${2+i%5} กิจกรรม</span></span>${ic('chev')}</button>`).join(''):Object.values(services).flat().map(([n,d,img,target])=>`<button class="service-card" onclick="state.service='${n}';go('${target}')"><img src="${ASSET[img]}"><span><h3>${n}</h3><p>${d}</p></span></button>`).join('')}</div>`}
function viewTempleProfile(id){const idx=Math.max(0,Math.min(24,Number(id.match(/T(\d+)/)?.[1]||1)-1)),name=templeNames[idx];return `${topbar('รายละเอียดวัด')}<div class="hero-photo" style="background-image:url('${ASSET[idx%3===0?'temple1':idx%3===1?'temple2':'hero']}')"><div class="hero-caption"><h2>${name}</h2><p>กรุงเทพมหานคร</p></div></div><div class="content"><div class="facts"><div class="fact">ระยะทาง<strong>${2+idx%7}.2 กม.</strong></div><div class="fact">บริการ<strong>${2+idx%5} รายการ</strong></div><div class="fact">สถานะ<strong>เปิดวันนี้</strong></div></div><h3>เกี่ยวกับวัด</h3><p class="sub">วัดไทยที่เปิดให้ประชาชนเข้าร่วมกิจกรรมทางศาสนาและจองบริการผ่าน WAT-Monk ข้อมูลในหน้านี้เป็นข้อมูลจำลองสำหรับเดโม</p><h3>กิจกรรมและบริการ</h3><button class="list-item" onclick="state.service='ทำบุญทั่วไปภายในวัด';go('S03')"><span class="list-icon">${ic('home')}</span><span class="list-text"><strong>ทำบุญทั่วไปภายในวัด</strong><span>60 นาที · พระ 5 รูป</span></span>${ic('chev')}</button><button class="list-item" onclick="go('BC03-UPO')"><span class="list-icon">${ic('calendar')}</span><span class="list-text"><strong>สวดมนต์และนั่งสมาธิ</strong><span>กิจกรรมเสมือน · ทุกวันพระ</span></span>${ic('chev')}</button></div>`}
function viewGeneric(id){const r=routeById.get(id)||{title:id,group:'',out:[]};const actions=(r.out||[]).filter(([target])=>routeById.has(target));return `${topbar(r.code||'WAT-Monk')}<div class="content"><p class="eyebrow">${esc((r.group||'').replace(/^\d+\s*/,''))}</p><h1 class="lead">${esc(r.title.replace(/^\S+\s*/,''))}</h1><p class="sub">สถานะนี้อยู่ในต้นแบบฉบับเต็ม เลือกการทำงานด้านล่างเพื่อเดินตาม Page Map</p><div class="card" style="padding:18px;margin-top:20px"><div class="quick-icon">${ic(id.startsWith('BC')?'calendar':id.startsWith('D')?'heart':id.startsWith('TM')?'settings':'home')}</div><h3 style="text-align:center">${esc(r.code)}</h3><p class="sub" style="text-align:center">ข้อมูลจำลองพร้อมสำหรับการนำเสนอ</p></div><p class="eyebrow" style="margin-top:22px">การทำงานจากหน้านี้</p>${actions.length?actions.map(([target,label])=>`<button class="role-option" onclick="go('${target}')"><span class="list-text"><strong>${esc(label||routeById.get(target)?.title||target)}</strong><span>${esc(routeById.get(target)?.code||target)}</span></span>${ic('chev')}</button>`).join(''):'<div class="notice">หน้าสุดท้ายของเส้นทางนี้ เลือกบทบาทหรือหน้าจออื่นจากเมนู DEMO</div>'}</div>`}
function viewMap(){const groups=[...new Set(ROUTES.map(r=>r.group))];return `${topbar('ผังหน้าจอทั้งหมด')}<div class="map-tools"><input id="mapSearch" placeholder="ค้นหา 350 หน้าจอ" value="${esc(state.mapSearch)}" oninput="filterMap(this.value)"></div><div class="content" id="mapList">${groups.map(g=>`<section class="map-group"><h3>${esc(g.replace(/^\d+\s*/,''))}</h3>${ROUTES.filter(r=>r.group===g).map(r=>`<button class="map-link" data-search="${esc((r.id+' '+r.code+' '+r.title).toLowerCase())}" onclick="go('${r.id}')"><b>${esc(r.code)}</b><span>${esc(r.title.replace(/^\S+\s*/,''))}</span></button>`).join('')}</section>`).join('')}</div>`}
function filterMap(value){state.mapSearch=value.toLowerCase();document.querySelectorAll('.map-link').forEach(e=>e.style.display=e.dataset.search.includes(state.mapSearch)?'flex':'none');document.querySelectorAll('.map-group').forEach(g=>g.style.display=[...g.querySelectorAll('.map-link')].some(e=>e.style.display!=='none')?'block':'none')}
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if((routeById.has(id)||id==='MAP')&&id!==state.view){state.view=id;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.sheet)closeLayer();else goBack()}});
const initial=decodeURIComponent(location.hash.slice(1));if(routeById.has(initial)||initial==='MAP')state.view=initial;render();
</script>
</body>
</html>
